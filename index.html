<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏕️ Wohnwagen Schluchsee</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#060d1a;
  --card:#101826;
  --card2:#182233;
  --blue:#38bdf8;
  --text:#e2e8f0;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
  padding:20px;
}

h1{
  font-size:42px;
  margin-bottom:25px;
  color:var(--blue);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 25px rgba(0,0,0,.4);
}

.label{
  color:#94a3b8;
  margin-bottom:10px;
}

.temp{
  font-size:70px;
  font-weight:800;
  color:var(--blue);
}

.humidity{
  font-size:20px;
  margin-top:10px;
}

.hourly{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-top:15px;
}

.hour{
  background:var(--card2);
  min-width:90px;
  border-radius:14px;
  padding:12px;
  text-align:center;
}

.hour-time{
  color:#94a3b8;
  font-size:14px;
}

.hour-temp{
  font-size:24px;
  margin-top:8px;
  color:var(--blue);
}

.status{
  margin-top:20px;
  color:#34d399;
}

</style>
</head>

<body>

<h1>🏕️ Wohnwagen Schluchsee</h1>

<div class="grid">

  <div class="card">

    <div class="label">
      🌤️ Aktuelles Wetter
    </div>

    <div id="weather">
      Wetter wird geladen...
    </div>

  </div>

  <div class="card">

    <div class="label">
      🕒 Stundenansicht
    </div>

    <div class="hourly" id="hourly"></div>

  </div>

</div>

<div class="status" id="status">
  Verbinde Wetter API...
</div>

<script>

async function loadWeather(){

  try{

    const latitude = 47.819;
    const longitude = 8.186;

    const url =
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${latitude}` +
      `&longitude=${longitude}` +
      `&current=temperature_2m,relative_humidity_2m,weather_code,is_day` +
      `&hourly=temperature_2m,precipitation_probability,weather_code` +
      `&forecast_days=7` +
      `&timezone=auto`;

    const response = await fetch(url);

    if(!response.ok){
      throw new Error('API Fehler');
    }

    const wx = await response.json();

    document.getElementById('weather').innerHTML = `

      <div class="temp">
        ${Math.round(wx.current.temperature_2m)}°C
      </div>

      <div class="humidity">
        Luftfeuchte:
        ${wx.current.relative_humidity_2m}%
      </div>

    `;

    let html = '';

    for(let i = 0; i < 12; i++){

      const time =
        wx.hourly.time[i]
        .split('T')[1];

      const temp =
        Math.round(wx.hourly.temperature_2m[i]);

      html += `

        <div class="hour">

          <div class="hour-time">
            ${time}
          </div>

          <div class="hour-temp">
            ${temp}°
          </div>

        </div>

      `;
    }

    document.getElementById('hourly').innerHTML = html;

    document.getElementById('status').innerHTML =
      '✅ Wetter erfolgreich geladen';

  }catch(err){

    console.error(err);

    document.getElementById('weather').innerHTML =
      '⚠ Wetter offline';

    document.getElementById('status').innerHTML =
      '❌ Wetter API Fehler';
  }
}

loadWeather();

</script>

</body>
</html>
