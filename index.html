<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏕️ Wohnwagen Schluchsee</title>

<style>

body{
  margin:0;
  padding:20px;
  background:#060d1a;
  color:white;
  font-family:Arial,sans-serif;
}

h1{
  color:#38bdf8;
}

.card{
  background:#101826;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.temp{
  font-size:70px;
  color:#38bdf8;
  font-weight:bold;
}

.desc{
  color:#94a3b8;
  margin-top:10px;
}

.hourly{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-top:10px;
}

.hour{
  background:#182233;
  border-radius:12px;
  padding:12px;
  min-width:80px;
  text-align:center;
}

.hour-time{
  color:#94a3b8;
  font-size:14px;
}

.hour-temp{
  font-size:22px;
  margin-top:10px;
  color:#38bdf8;
}

</style>
</head>

<body>

<h1>🏕️ Wohnwagen Schluchsee</h1>

<div class="card">

  <h2>🌤️ Aktuelles Wetter</h2>

  <div id="weather">
    Wetter wird geladen...
  </div>

</div>

<div class="card">

  <h2>🕒 Stundenansicht</h2>

  <div class="hourly" id="hourly">
  </div>

</div>

<script>

async function loadWeather(){

  try{

    const url =
      'https://api.open-meteo.com/v1/forecast' +
      '?latitude=47.819' +
      '&longitude=8.186' +
      '&current=temperature_2m,relative_humidity_2m,weather_code' +
      '&hourly=temperature_2m' +
      '&timezone=auto';

    const response = await fetch(url);

    const data = await response.json();

    document.getElementById('weather').innerHTML = `
      <div class="temp">
        ${Math.round(data.current.temperature_2m)}°C
      </div>

      <div class="desc">
        Luftfeuchtigkeit:
        ${data.current.relative_humidity_2m}%
      </div>
    `;

    let html = '';

    for(let i = 0; i < 12; i++){

      const time =
        data.hourly.time[i]
        .split('T')[1];

      const temp =
        Math.round(data.hourly.temperature_2m[i]);

      html += `
        <div class="hour">

          <div class="hour-time">
            ${time}
          </div>

          <div class="hour-temp">
            ${temp}°
          </div>

        </div>
      `;
    }

    document.getElementById('hourly').innerHTML = html;

  }catch(error){

    document.getElementById('weather').innerHTML =
      '⚠ Wetter offline';

    console.error(error);
  }
}

loadWeather();

</script>

</body>
</html>
